_ > nanoagent.plugin.v0001.ManifestConfig:
id: mnist-math
name: MNIST Math
version: 0.2.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  read_images:
    description: Give one or two bundled images' 28x28 pixels as rows of text, one character per pixel by its ink level; it never says which digit an image shows

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  digit-math:
    description: Add, subtract or multiply the handwritten digits in two images
    runner: agent
    tools: [read_images]
    reference: null
    instructions: |-
      Look. Call read_images once with both images, [first, second]. Each image comes as 28 rows of 28 pixels, top to bottom: '.' is blank paper and ':', '-', '=', '+', '*', '#', '%', '@' are ink from faintest to darkest. Each image is one handwritten digit, 0 to 9, from the MNIST dataset; no tool says which.
      Read. Decide which digit each image shows from the overall shape of its ink: its loops, strokes and where they start and end. The digits are handwritten, so they can be slanted, thick or thin. Be brief: name each digit in a sentence or two; do not trace or describe the rows one by one, or you will run out of room before you submit.
      Compute. add: first digit + second digit; subtract: first digit - second digit (it can be negative); multiply: first digit * second digit.
      Submit. Call submit with first and second (the image numbers, as given), the operator (as given), first_digit and second_digit (the digits you read) and result (the operator applied to them). Keep your reasoning short: your reply is limited.
  show-images:
    description: Show one or two of the images; use it whenever the person wants to see an image
    runner: tool
    tools: [read_images]
    reference: null
    instructions: Call read_images with the one or two images asked for, 1 to 100, and return them.
